name: CI

on:
  push:
    branches: [main, modernize-stack]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 타입 체크
        run: npm run typecheck

      - name: 앱 단위 테스트
        run: npm test -- --ci

      - name: DB 스키마·보안 규칙 테스트
        run: npm run test:db

      - name: Expo 설정 점검
        run: npx expo-doctor

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge Function 타입 체크
        run: deno check supabase/functions/*/index.ts
